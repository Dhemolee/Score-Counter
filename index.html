<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Basketball Scoreboard</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="container">
    <!-- HOME SECTION -->
    <div class="card">
      <h3>HOME</h3>
      <div id="home-score" class="score-display">0</div>
      <div class="button-group">
        <button class="btn" onclick="addHome(1)">+1</button>
        <button class="btn" onclick="addHome(2)">+2</button>
        <button class="btn" onclick="addHome(3)">+3</button>
      </div>
    </div>

    <!--  SECTION -->
    <div class="card">
      <h3>AWAY</h3>
      <div id="guest-score" class="score-display">0</div>
      <div class="button-group">
        <button class="btn" onclick="addGuest(1)">+1</button>
        <button class="btn" onclick="addGuest(2)">+2</button>
        <button class="btn" onclick="addGuest(3)">+3</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
